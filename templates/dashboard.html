{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="text-center mb-12">
        <h2 class="text-3xl font-extrabold text-gray-900 sm:text-4xl">
            <span class="block">Your Career Matches</span>
        </h2>
        <p class="mt-3 max-w-2xl mx-auto text-base text-gray-500 sm:mt-4">
            Based on your profile, here are some career paths that might interest you.
        </p>
    </div>

    <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
        {% for role in roles %}
        <div class="bg-white overflow-hidden shadow rounded-lg">
            <div class="px-4 py-5 sm:p-6">
                <div class="flex items-center">
                    <div class="flex-shrink-0 bg-indigo-100 rounded-md p-3">
                        <i class="fas fa-briefcase text-indigo-600 text-xl"></i>
                    </div>
                    <div class="ml-5 w-0 flex-1">
                        <h3 class="text-lg font-medium text-gray-900">{{ role.role }}</h3>
                        <div class="mt-1">
                            <div class="w-full bg-gray-200 rounded-full h-2.5">
                                <div class="bg-indigo-600 h-2.5 rounded-full"
                                     style="width: {{ role.match_score }}%"></div>
                            </div>
                            <p class="text-sm text-gray-500 mt-1">{{ role.match_score }}% Match</p>
                        </div>
                    </div>
                </div>
                <div class="mt-4">
                    <p class="text-sm text-gray-600">{{ role.reason }}</p>
                </div>
                <div class="mt-6">
                    <a href="{{ url_for('dashboard', role=role.role|lower|replace(' ', '-')) }}"
                       class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Explore Career
                        <i class="fas fa-arrow-right ml-2"></i>
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
